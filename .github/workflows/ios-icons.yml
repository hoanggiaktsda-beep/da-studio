name: Build iPhone Home Screen Icons
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - assets/brand-mark.svg
      - .github/workflows/ios-icons.yml
permissions:
  contents: write
jobs:
  png:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render PNG from canonical HOANGGIA AI logo
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          for size,name in [(180,'apple-touch-icon.png'),(192,'icon-192.png'),(512,'icon-512.png')]:
              cairosvg.svg2png(url='assets/brand-mark.svg',write_to='assets/'+name,output_width=size,output_height=size)
          PY
      - name: Commit PNG icons
        run: |
          git add assets/apple-touch-icon.png assets/icon-192.png assets/icon-512.png
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: add iOS-compatible PNG home-screen logo'
            git push
          fi
